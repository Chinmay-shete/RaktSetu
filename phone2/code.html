<body class="bg-bone-bg min-h-screen pb-24">
<div class="grain-overlay"></div>
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-bone-bg border-b border-border-subtle flex items-center justify-between px-margin-mobile py-4">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary">Profile</h1>
<div class="w-6"></div> <!-- Spacer for centering -->
</header>
<main class="max-w-md mx-auto px-margin-mobile pt-8 space-y-10">
<!-- Identity Section -->
<section class="space-y-6">
<div class="flex items-end justify-between border-b border-outline-variant pb-2">
<h2 class="font-headline-lg text-headline-lg-mobile text-primary italic">Identity</h2>
<span class="font-label-sm text-label-sm text-text-muted uppercase tracking-widest">Section 01</span>
</div>
<div class="space-y-4">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant">Full Name</label>
<input class="w-full bg-white border border-border-subtle rounded-lg px-4 py-3 text-body-md focus:ring-2 focus:ring-primary/40 focus:border-primary outline-none transition-all" placeholder="Enter your full name" type="text" value="Aarav Sharma">
</div>
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant">Age</label>
<input class="w-full bg-white border border-border-subtle rounded-lg px-4 py-3 text-body-md focus:ring-2 focus:ring-primary/40 focus:border-primary outline-none transition-all" type="number" value="28">
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant">Gender</label>
<select class="w-full bg-white border border-border-subtle rounded-lg px-4 py-3 text-body-md focus:ring-2 focus:ring-primary/40 focus:border-primary outline-none transition-all appearance-none">
<option>Male</option>
<option>Female</option>
<option>Non-binary</option>
<option>Prefer not to say</option>
</select>
</div>
</div>
</div>
</section>
<!-- Geography Section -->
<section class="space-y-6">
<div class="flex items-end justify-between border-b border-outline-variant pb-2">
<h2 class="font-headline-lg text-headline-lg-mobile text-primary italic">Geography</h2>
<span class="font-label-sm text-label-sm text-text-muted uppercase tracking-widest">Section 02</span>
</div>
<div class="space-y-4">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant">City</label>
<input class="w-full bg-white border border-border-subtle rounded-lg px-4 py-3 text-body-md focus:ring-2 focus:ring-primary/40 focus:border-primary outline-none transition-all" type="text" value="New Delhi">
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant">Pincode</label>
<input class="w-full bg-white border border-border-subtle rounded-lg px-4 py-3 text-body-md focus:ring-2 focus:ring-primary/40 focus:border-primary outline-none transition-all" type="text" value="110001">
</div>
</div>
</section>
<!-- Medical Section -->
<section class="space-y-6">
<div class="flex items-end justify-between border-b border-outline-variant pb-2">
<h2 class="font-headline-lg text-headline-lg-mobile text-primary italic">Medical</h2>
<span class="font-label-sm text-label-sm text-text-muted uppercase tracking-widest">Section 03</span>
</div>
<!-- Blood Group Highlight Card -->
<div class="bg-primary/5 border border-primary/10 rounded-xl p-5 relative overflow-hidden">
<div class="absolute -right-4 -top-4 opacity-10">
<span class="material-symbols-outlined text-8xl text-primary" style="font-variation-settings: 'FILL' 1;">bloodtype</span>
</div>
<div class="relative z-10 flex flex-col gap-1">
<span class="font-label-sm text-label-sm text-primary uppercase tracking-widest">Verified Blood Type</span>
<div class="flex items-center gap-3">
<span class="font-display-xl-mobile text-display-xl-mobile text-primary leading-none">O+</span>
<span class="bg-primary text-white rounded-full px-2 py-0.5 text-[10px] font-bold uppercase">Positive</span>
</div>
<p class="font-body-md text-xs text-on-surface-variant mt-2 flex items-start gap-2">
<span class="material-symbols-outlined text-sm mt-0.5">info</span>
                        This field is locked. Changing blood group requires medical verification from a certified center.
                    </p>
</div>
</div>
<div class="space-y-4">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant">Weight (kg)</label>
<input class="w-full bg-white border border-border-subtle rounded-lg px-4 py-3 text-body-md focus:ring-2 focus:ring-primary/40 focus:border-primary outline-none transition-all" type="number" value="74">
</div>
<div class="flex items-center justify-between bg-white border border-border-subtle rounded-lg p-4">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">Chronic Illness</span>
<span class="text-xs text-text-muted">Do you have any existing conditions?</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value="">
<div class="w-11 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</div>
</section>
<!-- Form Actions -->
<div class="flex flex-col gap-3 pt-6 pb-12">
<button class="w-full bg-primary text-on-primary font-label-md py-4 rounded-full primary-spring hover:opacity-90 shadow-xl shadow-primary/20 transition-all">
                Save Changes
            </button>
<button class="w-full bg-transparent text-on-surface-variant font-label-md py-3 rounded-full hover:bg-surface-container-low transition-colors">
                Cancel
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-charcoal-card flex justify-around items-center px-4 py-3 h-20 shadow-xl">
<button class="flex flex-col items-center justify-center text-text-muted px-4 py-1 hover:text-primary-fixed-dim transition-colors nav-item-spring">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-text-muted px-4 py-1 hover:text-primary-fixed-dim transition-colors nav-item-spring">
<span class="material-symbols-outlined">bloodtype</span>
<span class="font-label-sm text-label-sm">Requests</span>
</button>
<button class="flex flex-col items-center justify-center text-text-muted px-4 py-1 hover:text-primary-fixed-dim transition-colors nav-item-spring">
<span class="material-symbols-outlined">explore</span>
<span class="font-label-sm text-label-sm">Map</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary text-on-primary rounded-full px-4 py-1 nav-item-spring">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</button>
</nav>
<script>
        // Micro-interaction for input fields focus
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label')?.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label')?.classList.remove('text-primary');
            });
        });
    </script>
</body></html>
