upstream raktsetu_api {
  least_conn;                          # Route to least busy worker
  server 127.0.0.1:5000;              # PM2 handles cluster internally
  keepalive 64;                        # Keep connections warm
}

upstream raktsetu_ai {
  server 127.0.0.1:5001;
  keepalive 8;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:20m  rate=100r/m;
limit_req_zone $binary_remote_addr zone=ai_limit:10m   rate=10r/m;

server {
  listen 80;
  server_name raktsetu.com www.raktsetu.com;
  return 301 https://$server_name$request_uri;  # Force HTTPS
}

server {
  listen 443 ssl http2;
  server_name raktsetu.com www.raktsetu.com;

  # SSL (Certbot fills these in)
  ssl_certificate     /etc/letsencrypt/live/raktsetu.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/raktsetu.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  # Security headers
  add_header X-Frame-Options           "SAMEORIGIN" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header X-XSS-Protection          "1; mode=block" always;
  add_header Strict-Transport-Security "max-age=63072000" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

  # Gzip compression
  gzip on;
  gzip_types text/plain application/json application/javascript text/css;
  gzip_min_length 1000;
  gzip_comp_level 6;

  # React frontend (serve static build)
  root /var/www/raktsetu/dist;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;  # SPA fallback
    expires 1d;
    add_header Cache-Control "public, max-age=86400, must-revalidate";
  }

  # Static assets with long cache
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Express API
  location /api/ {
    limit_req zone=api_limit burst=50 nodelay;
    proxy_pass         http://raktsetu_api;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection 'upgrade';
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;
  }

  # Auth endpoints — stricter rate limit
  location /api/auth/ {
    limit_req zone=auth_limit burst=3 nodelay;
    proxy_pass http://raktsetu_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
