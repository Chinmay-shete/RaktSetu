upstream raktsetu_api {
  least_conn;                          # Route to least busy worker
  server 127.0.0.1:5000;              # PM2 handles cluster internally
  keepalive 64;                        # Keep connections warm
}

upstream raktsetu_ai {
  server 127.0.0.1:5001;
  keepalive 8;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:20m  rate=100r/m;
limit_req_zone $binary_remote_addr zone=ai_limit:10m   rate=10r/m;

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
  listen 80;
  server_name raktsetu.online www.raktsetu.online;
  return 301 https://$host$request_uri;
}

# ── HTTPS main server ────────────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  server_name raktsetu.online www.raktsetu.online;

  # SSL (Certbot fills these in — run: certbot --nginx -d raktsetu.online -d www.raktsetu.online)
  ssl_certificate     /etc/letsencrypt/live/raktsetu.online/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/raktsetu.online/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  # Security headers
  add_header X-Frame-Options           "SAMEORIGIN" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header X-XSS-Protection          "1; mode=block" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

  # Gzip compression
  gzip on;
  gzip_types text/plain application/json application/javascript text/css text/xml;
  gzip_min_length 1000;
  gzip_comp_level 6;
  gzip_vary on;

  # React frontend — serve Vite dist build
  root /var/www/raktsetu/dist;
  index index.html;

  # ── SPA fallback: ALL non-API, non-asset requests → index.html ──────────
  # This fixes 404 on /login, /dashboard, /admin/login etc. when accessed
  # directly or on page refresh.
  location / {
    try_files $uri $uri/ /index.html;
    expires 1d;
    add_header Cache-Control "public, max-age=86400, must-revalidate";
  }

  # ── Vite hashed static assets — long cache ─────────────────────────────
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # ── Auth endpoints — stricter rate limit (MUST be before /api/) ─────────
  location /api/v1/auth/ {
    limit_req zone=auth_limit burst=5 nodelay;
    proxy_pass         http://raktsetu_api;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    15s;
  }

  # ── All other API requests ───────────────────────────────────────────────
  location /api/ {
    limit_req zone=api_limit burst=50 nodelay;
    proxy_pass         http://raktsetu_api;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        'upgrade';
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;
  }

  # ── Uploaded files (hospital license docs etc.) ─────────────────────────
  location /uploads/ {
    alias /var/www/raktsetu/backend/uploads/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }
}

